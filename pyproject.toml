[project]
name = "franka-teleop"
version = "0.1.0"
description = "iPhone ARKit pose teleoperation of a local MuJoCo Franka Panda"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "server/models/panda/LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "mujoco>=3.3,<4",
    "numpy>=2,<3",
    "websockets>=14,<16",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
